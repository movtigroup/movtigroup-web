worker_processes auto;

events {
    worker_connections 1024;
}

http {
    upstream movtigroup {
        server nuxt:3002;
    }

    server {
        listen 80;
        server_name localhost;

        location / {
            proxy_pass http://movtigroup;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # Static build assets — long cache
        location /_nuxt/ {
            proxy_pass http://movtigroup;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Gzip compression
        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_comp_level 6;
        gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml application/font-woff2;
    }
}
