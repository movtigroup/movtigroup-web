name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18, 20]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run linter
        run: npm run lint --if-present
        continue-on-error: true

      - name: Build application
        run: npm run build

      - name: Run tests
        run: npm test --if-present
        continue-on-error: true

  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: movtigroup-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker container
        run: |
          docker run -d --name test-container -p 3002:3000 movtigroup-web:latest
          sleep 10
          
          # Health check
          echo "Testing health endpoint..."
          curl -f http://localhost:3002/api/health || exit 1
          
          # Test homepage
          echo "Testing homepage..."
          curl -f http://localhost:3002/ || exit 1
          
          # Test blog page
          echo "Testing blog page..."
          curl -f http://localhost:3002/blog || exit 1
          
          echo "✅ All Docker tests passed!"
          
          # Cleanup
          docker stop test-container
          docker rm test-container

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to server
        run: |
          echo "🚀 Deploy step - customize with your deployment strategy"
          echo "Options: SSH deploy, Kubernetes, Vercel, Netlify, etc."
          echo "✅ Build verified and ready for deployment"
