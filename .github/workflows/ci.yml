name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_PORT: 3002

jobs:
  build-and-test:
    name: Build & SSR Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Node 22+ required by better-sqlite3 (@nuxt/content)
        node: [22, 24]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Unit tests (Vitest)
        run: npm test

      - name: Audit production dependencies (high severity fails the build)
        run: npm audit --omit=dev --audit-level=high

      - name: Build Nuxt application
        run: npm run build

      - name: Check build output
        run: |
          test -f .output/server/index.mjs || { echo "❌ missing .output/server/index.mjs"; exit 1; }
          test -d .output/public || { echo "❌ missing .output/public"; exit 1; }
          FONTS=$(find .output/public -name "*.woff2" | wc -l)
          echo "Bundled woff2 fonts: $FONTS"
          [ "$FONTS" -gt 0 ] || { echo "❌ no self-hosted fonts found"; exit 1; }
          test -f .output/public/og-image.png || { echo "❌ missing og-image.png"; exit 1; }
          echo "✅ Build output valid"

      - name: Client bundle budget
        run: |
          JS=$(find .output/public/_nuxt -name "*.js" -exec du -cb {} + | tail -1 | cut -f1)
          echo "client JS total: $((JS/1024)) KB"
          [ "$JS" -le 2500000 ] || { echo "❌ client JS exceeds 2.5MB budget"; exit 1; }
          echo "✅ within bundle budget"

      - name: Start production server on port 3002
        run: |
          npm run start &
          for i in $(seq 1 30); do
            if curl -sf "http://localhost:${APP_PORT}/api/health" > /dev/null; then
              echo "✅ server is up on :${APP_PORT}"
              break
            fi
            sleep 1
          done
          curl -sf "http://localhost:${APP_PORT}/api/health" > /dev/null || { echo "❌ server did not start"; exit 1; }

      - name: Test SSR pages (EN + FA)
        run: |
          BASE="http://localhost:${APP_PORT}"
          for path in / /blog /projects /about /contact /collaborations; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "$BASE$path")
            [ "$CODE" = "200" ] || { echo "❌ EN $path -> $CODE"; exit 1; }
          done
          for path in /fa /fa/blog /fa/projects /fa/about /fa/contact; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "$BASE$path")
            [ "$CODE" = "200" ] || { echo "❌ FA $path -> $CODE"; exit 1; }
          done
          echo "✅ All SSR pages OK (EN + FA)"

      - name: Test SEO endpoints & tags
        run: |
          BASE="http://localhost:${APP_PORT}"
          # dynamic sitemap
          COUNT=$(curl -s "$BASE/sitemap.xml" | grep -c "<url>")
          [ "$COUNT" -gt 100 ] || { echo "❌ sitemap has only $COUNT urls"; exit 1; }
          echo "✅ sitemap.xml has $COUNT urls"
          # robots.txt
          curl -s "$BASE/robots.txt" | grep -q "Sitemap:" || { echo "❌ robots.txt missing sitemap"; exit 1; }
          # hreflang + canonical on home
          curl -s "$BASE/" | grep -q 'rel="canonical"' || { echo "❌ canonical missing"; exit 1; }
          curl -s "$BASE/" | grep -q 'hreflang="fa"' || { echo "❌ hreflang missing"; exit 1; }
          curl -s "$BASE/fa" | grep -q 'dir="rtl"' || { echo "❌ RTL dir missing on /fa"; exit 1; }
          # security headers
          curl -sI "$BASE/" | grep -qi "x-frame-options" || { echo "❌ X-Frame-Options missing"; exit 1; }
          curl -sI "$BASE/" | grep -qi "content-security-policy" || { echo "❌ CSP missing"; exit 1; }
          curl -sI "$BASE/" | grep -qi "referrer-policy" || { echo "❌ Referrer-Policy missing"; exit 1; }
          # blog post structured data
          curl -s "$BASE/blog" | grep -oE 'href="/blog/[a-z0-9-]+"' | head -1 | sed 's/href="//;s/"//' > post_url
          POST=$(cat post_url)
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "$BASE$POST")
          [ "$CODE" = "200" ] || { echo "❌ blog post $POST -> $CODE"; exit 1; }
          curl -s "$BASE$POST" | grep -q "BlogPosting" || { echo "❌ BlogPosting JSON-LD missing"; exit 1; }
          echo "✅ SEO + security header checks passed ($POST)"

      - name: Stop smoke-test server
        run: pkill -f ".output/server/index.mjs" || true; sleep 2

      - name: Lighthouse CI (performance / SEO / a11y / best-practices)
        run: npx --yes @lhci/cli@0.14.x autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  content-check:
    name: Content & i18n Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate content structure
        run: |
          EN_POSTS=$(ls content/en/blog/*.md 2>/dev/null | wc -l)
          FA_POSTS=$(ls content/fa/blog/*.md 2>/dev/null | wc -l)
          echo "English posts: $EN_POSTS"
          echo "Farsi posts: $FA_POSTS"
          test -f i18n/en.json || { echo "❌ Missing i18n/en.json"; exit 1; }
          test -f i18n/fa.json || { echo "❌ Missing i18n/fa.json"; exit 1; }
          [ "$EN_POSTS" -gt 0 ] || { echo "❌ No English posts"; exit 1; }
          [ "$FA_POSTS" -gt 0 ] || { echo "❌ No Farsi posts"; exit 1; }
          echo "✅ Content structure valid ($EN_POSTS EN, $FA_POSTS FA)"

      - name: Validate frontmatter
        run: |
          ERRORS=0
          for f in content/en/blog/*.md content/fa/blog/*.md; do
            head -20 "$f" | grep -q "^title:" || { echo "❌ missing title: $f"; ERRORS=$((ERRORS+1)); }
            head -20 "$f" | grep -qE "^date: [0-9]{4}-[0-9]{2}-[0-9]{2}" || { echo "❌ missing/invalid date: $f"; ERRORS=$((ERRORS+1)); }
            head -20 "$f" | grep -q "^description:" || { echo "❌ missing description: $f"; ERRORS=$((ERRORS+1)); }
          done
          if [ "$ERRORS" -gt 0 ]; then echo "❌ $ERRORS frontmatter errors"; exit 1; fi
          echo "✅ All posts have valid frontmatter"

      - name: Validate JSON files
        run: |
          node -e "JSON.parse(require('fs').readFileSync('i18n/en.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('i18n/fa.json','utf8'))"
          echo "✅ i18n JSON files are valid"

  docker:
    name: Docker Build & Test
    runs-on: ubuntu-latest
    needs: [build-and-test, content-check]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: movtigroup-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker container on port 3002
        run: |
          docker run -d --name test-container -p 3002:3002 -e PORT=3002 movtigroup-web:latest
          for i in $(seq 1 30); do
            if curl -sf "http://localhost:3002/api/health" > /dev/null; then break; fi
            sleep 2
          done
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:3002/api/health")
          [ "$CODE" = "200" ] || { docker logs test-container; exit 1; }
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:3002/")
          [ "$CODE" = "200" ] || { echo "❌ container homepage -> $CODE"; exit 1; }
          echo "✅ Docker container works on port 3002"
          docker stop test-container && docker rm test-container
