name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test-node:
    name: Test Node.js & Nuxt
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Check Node.js version
        run: |
          echo "Node version: $(node --version)"
          echo "NPM version: $(npm --version)"

      - name: Lint code
        run: npm run lint --if-present
        continue-on-error: true

      - name: Build Nuxt application
        run: npm run build

      - name: Check build output
        run: |
          echo "Checking build output..."
          ls -la .output/
          ls -la .output/server/
          echo "✅ Build successful!"

      - name: Test SSR rendering (EN + FA pages)
        run: |
          echo "Testing SSR rendering..."
          npm run preview &
          sleep 5
          
          # Test English pages
          echo "Testing EN pages..."
          curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/ | grep -q "200" || (echo "❌ Homepage failed" && exit 1)
          curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/blog | grep -q "200" || (echo "❌ Blog failed" && exit 1)
          curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/about | grep -q "200" || (echo "❌ About failed" && exit 1)
          curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/projects | grep -q "200" || (echo "❌ Projects failed" && exit 1)
          curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/contact | grep -q "200" || (echo "❌ Contact failed" && exit 1)
          
          # Test Farsi (RTL) pages
          echo "Testing FA pages..."
          curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/fa | grep -q "200" || (echo "❌ FA Homepage failed" && exit 1)
          curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/fa/blog | grep -q "200" || (echo "❌ FA Blog failed" && exit 1)
          curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/fa/about | grep -q "200" || (echo "❌ FA About failed" && exit 1)
          
          echo "✅ All SSR tests passed (EN + FA)!"
          pkill -f "node .output/server/index.mjs" || true

  test-content:
    name: Test Content & i18n
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Check content files
        run: |
          echo "Checking content structure..."
          EN_POSTS=$(ls content/en/blog/*.md 2>/dev/null | wc -l)
          FA_POSTS=$(ls content/fa/blog/*.md 2>/dev/null | wc -l)
          I18N_FILES=$(ls i18n/*.json 2>/dev/null | wc -l)
          echo "English posts: $EN_POSTS"
          echo "Farsi posts: $FA_POSTS"
          echo "i18n files: $I18N_FILES"
          
          # Check for required files
          test -f i18n/en.json || (echo "❌ Missing en.json" && exit 1)
          test -f i18n/fa.json || (echo "❌ Missing fa.json" && exit 1)
          [ "$EN_POSTS" -gt 0 ] || (echo "❌ No English posts found" && exit 1)
          [ "$FA_POSTS" -gt 0 ] || (echo "❌ No Farsi posts found" && exit 1)
          echo "✅ Content structure valid! ($EN_POSTS EN, $FA_POSTS FA posts)"

      - name: Validate frontmatter
        run: |
          echo "Validating post frontmatter..."
          ERRORS=0
          for file in content/en/blog/*.md; do
            if ! head -20 "$file" | grep -q "^title:"; then
              echo "❌ Missing title in $file"
              ERRORS=$((ERRORS + 1))
            fi
            if ! head -20 "$file" | grep -q "^date:"; then
              echo "❌ Missing date in $file"
              ERRORS=$((ERRORS + 1))
            fi
          done
          if [ "$ERRORS" -gt 0 ]; then
            echo "❌ Found $ERRORS frontmatter errors"
            exit 1
          fi
          echo "✅ All posts have valid frontmatter!"

  docker:
    name: Docker Build & Test
    runs-on: ubuntu-latest
    needs: [test-node, test-content]
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: movtigroup-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker container
        run: |
          echo "Starting Docker container on port 3003..."
          docker run -d --name test-container -p 3003:3000 movtigroup-web:latest
          sleep 15
          
          # Health check
          echo "Testing health endpoint..."
          curl -s -o /dev/null -w "%{http_code}" http://localhost:3003/api/health | grep -q "200" || (docker logs test-container && exit 1)
          
          # Test pages
          echo "Testing pages..."
          curl -s -o /dev/null -w "%{http_code}" http://localhost:3003/ | grep -q "200" || exit 1
          curl -s -o /dev/null -w "%{http_code}" http://localhost:3003/blog | grep -q "200" || exit 1
          curl -s -o /dev/null -w "%{http_code}" http://localhost:3003/projects | grep -q "200" || exit 1
          
          echo "✅ All Docker tests passed!"
          
          # Cleanup
          docker stop test-container
          docker rm test-container

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to server
        run: |
          echo "🚀 Deploy step - customize with your deployment strategy"
          echo "Options: SSH deploy, Kubernetes, Vercel, Netlify, etc."
          echo "✅ Build verified and ready for deployment"
